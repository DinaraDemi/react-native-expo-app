name: Deploy web to GitHub Pages

# Deploys the static web build (npx expo export) to GitHub Pages on every
# push to `main`, or manually via the Actions tab.
#
# Prerequisites (one-time, in the repo settings on GitHub):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables:
#     EXPO_PUBLIC_AUTH_API_URL = https://<your-hosted-auth-server>  (optional)
#
# Notes:
#   - EXPO_PUBLIC_API_URL / EXPO_PUBLIC_COVERS_API_URL default to the public
#     OpenLibrary endpoints and don't need to be set.
#   - The app calls an auth server at EXPO_PUBLIC_AUTH_API_URL for login.
#     GitHub Pages is static-only, so without hosting `server/index.js`
#     elsewhere (Render/Railway/Fly.io…) the login screen won't work in the
#     deployed web build. Set the variable above once the server is hosted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://openlibrary.org' }}
          EXPO_PUBLIC_COVERS_API_URL: ${{ vars.EXPO_PUBLIC_COVERS_API_URL || 'https://covers.openlibrary.org' }}
          EXPO_PUBLIC_AUTH_API_URL: ${{ vars.EXPO_PUBLIC_AUTH_API_URL || 'http://localhost:4000' }}
        run: npx expo export --platform web

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4